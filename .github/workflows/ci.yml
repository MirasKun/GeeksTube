name: Check Ready

on:
  push:
    branches: ["main", "dev", "Erjan", "Muhammed", "Almir", "Miras", "Nurbai", "dony"]
  pull_request:
    branches: [dev, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run lint and build
        run: npm run ready
